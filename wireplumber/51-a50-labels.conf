## Give the Logitech A50 Pro Audio outputs/inputs readable names.
## Pro Audio output/input 0 = Voice, output/input 1 = Game, as verified
## with the headset's chat-mix dial. ALSA card numbers can change.

monitor.alsa.rules = [
  {
    ## Default to the Pro Audio profile whenever the A50 is (re)connected,
    ## so both the Voice and Game outputs show up automatically.
    matches = [
      {
        api.alsa.card.name = "A50"
      }
    ]
    actions = {
      update-props = {
        device.profile = "pro-audio"
      }
    }
  }
  {
    matches = [
      {
        api.alsa.card.name = "A50"
        device.profile.name = "pro-output-0"
      }
    ]
    actions = {
      update-props = {
        node.description = "A50 Voice"
        node.nick        = "A50 Voice"
      }
    }
  }
  {
    matches = [
      {
        api.alsa.card.name = "A50"
        device.profile.name = "pro-output-1"
      }
    ]
    actions = {
      update-props = {
        node.description = "A50 Game"
        node.nick        = "A50 Game"
      }
    }
  }
  {
    matches = [
      {
        api.alsa.card.name = "A50"
        device.profile.name = "pro-input-0"
      }
    ]
    actions = {
      update-props = {
        node.description = "A50 Mic (Voice)"
        node.nick        = "A50 Mic (Voice)"
      }
    }
  }
  {
    matches = [
      {
        api.alsa.card.name = "A50"
        device.profile.name = "pro-input-1"
      }
    ]
    actions = {
      update-props = {
        node.description = "A50 Mic (Game)"
        node.nick        = "A50 Mic (Game)"
      }
    }
  }
]
